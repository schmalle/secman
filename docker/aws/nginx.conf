# nginx for the Secman all-in-one container.
# Listens on :80 (TLS terminates at the AWS ALB) and routes:
#   /api/, /oauth/, /mcp, /health  -> Micronaut backend  (127.0.0.1:8080)
#   /_astro/ + static assets       -> served from disk   (/app/frontend/client)
#   everything else (SSR pages)    -> Astro Node server  (127.0.0.1:4321)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    upstream backend {
        server 127.0.0.1:8080;
    }

    upstream frontend_ssr {
        server 127.0.0.1:4321;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (HSTS is added by the ALB/CloudFront when TLS-fronted)
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        # API requests -> backend.
        # proxy_buffering off + long read timeout keep the SSE endpoints
        # (/api/exception-badge-updates, /api/.../progress) streaming.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # OAuth flow -> backend
        location /oauth/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # MCP (streamable HTTP / JSON-RPC) -> backend
        location /mcp {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Health endpoint -> backend (also used by the ALB target group
        # and the container HEALTHCHECK)
        location /health {
            proxy_pass http://backend;
        }

        # Hashed immutable build assets straight from disk
        location /_astro/ {
            root /app/frontend/client;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Other static files (favicon, fonts, images placed in public/)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /app/frontend/client;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri @ssr;
        }

        # Everything else: server-side rendered pages
        location / {
            try_files /nonexistent @ssr;
        }

        location @ssr {
            proxy_pass http://frontend_ssr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
