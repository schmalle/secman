# Squid as a domain-allowlisting egress gate for the Secman dev container.
#
# This is not a cache and not a shared proxy: it listens on loopback only, keeps
# nothing on disk, and exists purely so that outbound traffic is filtered by
# *name* rather than by IP. Name-level filtering is what makes the allowlist
# meaningful — api.anthropic.com, registry.npmjs.org and half the internet share
# CDN address space, so an IP allowlist alone cannot express "Anthropic yes,
# everything else on that CDN no".
#
# The companion iptables ruleset (init-egress-firewall) drops every packet that
# does not originate from squid's own uid, so nothing can route around this file.

http_port 127.0.0.1:3128

# The rendered allowlist: allowlist.txt + allowlist.local.txt + any --allow-domain
# entries, comments stripped, one dstdomain pattern per line. Written at start by
# the entrypoint; a leading dot matches the domain and all of its subdomains.
acl allowed_domains dstdomain "/run/secman-dev/egress/allowlist.rendered"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Order matters: deny the unsafe shapes before considering the allowlist, so a
# future allowlist entry can never re-open, say, CONNECT to an arbitrary port.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# Nothing is cached — this proxy is a policy point, not an accelerator. Caching
# build artifacts here would only duplicate the Gradle/npm caches that already
# live on their own volumes.
cache deny all
cache_store_log none

# Do not advertise the proxy or leak the requesting process's address upstream.
via off
forwarded_for delete
httpd_suppress_version_string on

# The access log is the audit trail for everything the agents and the build
# reached (§A09: actor + target + outcome). `egress-check --log` reads it.
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 3

# Apple's default container kernel has incomplete IPv6 support and the
# entrypoint disables IPv6 outright; resolving AAAA records here would only
# produce connections that can never be established.
dns_v4_first on

# Build downloads (Gradle distributions, Playwright browsers, JDKs) are large and
# slow; the defaults would abort them.
read_timeout 15 minutes
request_timeout 5 minutes
connect_timeout 1 minute
shutdown_lifetime 5 seconds

pid_filename /run/squid.pid
