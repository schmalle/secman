# TLS front door for the Secman shielded dev container (:443).
#
# Purpose: give the container the same single-origin HTTPS shape the developer
# has on the Mac, where a reverse proxy owns :443 and fans out to the Astro dev
# server and the Micronaut backend. Without it, cookie flags (the HttpOnly
# `secman_auth` cookie is Secure), CORS, OAuth redirects and the SSE endpoints
# all behave differently inside the container than out, and the E2E gates that
# drive an HTTPS origin cannot run here at all.
#
# Routing mirrors docker/aws/nginx.conf, with one deliberate difference: static
# assets are NOT served from disk. This is a dev container — the frontend runs
# as `astro dev`, so Vite owns asset serving and hot reload.
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx-secman-dev.pid;
daemon     on;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    upstream secman_backend  { server 127.0.0.1:8080; }
    upstream secman_frontend { server 127.0.0.1:4321; }

    # Plain HTTP exists only to say "use HTTPS". The dev origin is HTTPS because
    # the auth cookie is Secure; serving the app over :80 would produce a login
    # that silently never persists.
    server {
        listen 80 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed, regenerated by `devctl tls start` whenever the configured
        # host changes. Trust it on the Mac, or point the CLI/tests at
        # SECMAN_SSL_ACCEPT_ALL as they already do for the host setup.
        ssl_certificate     /run/secman-dev/tls/dev.crt;
        ssl_certificate_key /run/secman-dev/tls/dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SECMANDEV:4m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Backend. proxy_buffering off plus a long read timeout keep the SSE
        # endpoints (/api/exception-badge-updates, /api/.../progress) streaming
        # instead of arriving in one lump at the end.
        location ~ ^/(api|oauth)/ {
            proxy_pass http://secman_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        location /mcp {
            proxy_pass http://secman_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://secman_backend;
        }

        # Everything else is the Astro dev server. The Upgrade/Connection pair is
        # not optional here: Vite's HMR runs over a WebSocket, and without it the
        # frontend reloads nothing and floods the console with retries.
        location / {
            proxy_pass http://secman_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
