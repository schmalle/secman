# Optional — see hpa-backend.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secman-frontend
  namespace: secman
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secman-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
