# Test configuration for Feature 056 - Test Suite
# Applied when running tests with @MicronautTest

micronaut:
  server:
    port: -1
  application:
    name: secman-test
  security:
    enabled: true
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: test-secret-key-for-jwt-signing-minimum-256-bits-long-enough
              jws-algorithm: HS256
        generator:
          access-token:
            expiration: 3600

# Datasource: external MariaDB (no Docker/Testcontainers).
# scripts/runbackendtests.sh supplies TEST_DB_* from a marked, disposable
# secman_e2e_* schema. SAFETY: hbm2ddl=create-drop must never target the
# persistent dev/production database.
datasources:
  default:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driverClassName: org.mariadb.jdbc.Driver
    dialect: MYSQL

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
        show_sql: false
        format_sql: false

# Disable Flyway for tests - use Hibernate schema generation
flyway:
  enabled: false

# The reconcile percentage brake is unit-tested with explicit thresholds; the
# integration scenarios exercise sweep semantics with small fixtures whose
# stale/total ratios routinely exceed any realistic threshold, so the brake is
# disabled (100) for @MicronautTest runs only.
secman:
  crowdstrike:
    reconcile:
      max-delete-percent: 100

# Reduce logging verbosity in tests
logger:
  levels:
    io.micronaut: WARN
    com.secman: INFO
    org.hibernate: WARN
