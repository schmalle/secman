 <VirtualHost *:80>
      ServerName secman.covestro.net

      # Enable proxy modules
      ProxyPreserveHost On
      ProxyRequests Off

      # /oauth routes to 8080 (REMOVED trailing slashes)
      ProxyPass /oauth http://localhost:8080/oauth
      ProxyPassReverse /oauth http://localhost:8080/oauth

      # /api routes to 8080.
      #
      # timeout=3600 is not optional. Apache 2.4's Timeout defaults to 60s and
      # ProxyTimeout inherits it, which severs two kinds of legitimate request:
      # the SSE streams (/api/exception-badge-updates,
      # /api/materialized-view-refresh/progress) and long admin jobs. It is the
      # same 3600s the nginx configs already carry for this location — see
      # scripts/install/nginx/nginx.conf.
      ProxyPass /api http://localhost:8080/api timeout=3600
      ProxyPassReverse /api http://localhost:8080/api

      # Everything else routes to 4321
      ProxyPass / http://localhost:4321/
      ProxyPassReverse / http://localhost:4321/
  </VirtualHost>
